[project]
name = "agentforge-backend"
version = "0.1.0"
description = "AgentForge — API y motor de ejecución agéntica"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "pgvector>=0.3",
    "anthropic>=0.90",
    "openai>=1.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Agente con navegador (v2). Instalar aparte: pip install -e ".[browser]"
# y luego `playwright install chromium` (o usar el Chromium preinstalado).
browser = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
